
name: Exerpia Wallet Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o ExerpiaWalletAndroid_Source.zip -d android-project

      - name: Build Android App Bundle
        run: |
          PROJECT_DIR="$(dirname "$(find android-project -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle bundleRelease

      - name: Sign Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Signing key file is not configured yet."
          exit 1

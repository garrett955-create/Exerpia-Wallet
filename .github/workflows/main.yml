
name: Exerpia Wallet Signed Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo "Missing UPLOAD_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }

      - name: Extract Android project
        run: |
          set -eu
          unzip -o ExerpiaWalletAndroid_Source.zip -d android-project
          test -f android-project/settings.gradle.kts

      - name: Build and sign Android App Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias exerpia-upload

          cd android-project
          gradle bundleRelease

          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"

          jarsigner \
            -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" \
            exerpia-upload

          jarsigner -verify "$AAB"

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$AAB" "$GITHUB_WORKSPACE/output/exerpia-wallet-signed.aab"

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: exerpia-wallet-signed-aab
          path: output/exerpia-wallet-signed.aab
          if-no-files-found: error
          retention-days: 7

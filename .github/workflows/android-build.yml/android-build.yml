
name: Exerpia Wallet Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source project
        run: |
          mkdir android-source
          unzip ExerpiaWalletAndroid_Source.zip -d android-source
          find android-source -name build.gradle.kts

      - name: Build release bundle
        run: |
          cd android-source
          gradle bundleRelease

      - name: Save AAB
        uses: actions/upload-artifact@v4
        with:
          name: Exerpia-Wallet-AAB
          path: android-source/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error



name: Exerpia Wallet Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip ExerpiaWalletAndroid_Source.zip -d android-project
          find android-project -name build.gradle.kts

      - name: Build bundle
        run: |
          cd android-project
          gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: exerpia-wallet-aab
          path: android-project/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
